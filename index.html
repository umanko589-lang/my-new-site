<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA TRAVEL — Туры и путешествия из Алматы</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #0f172a; --accent: #d97706; --light: #f8fafc; --text: #334155; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; color: var(--text); background: #fff; line-height: 1.6; }
    .ta-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .ta-header { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 15px 0; position: sticky; top: 0; z-index: 100; }
    .ta-header-inner { display: flex; justify-content: space-between; align-items: center; }
    .ta-logo-name { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; color: var(--primary); text-decoration: none; }
    .ta-hero { background: linear-gradient(rgba(15,23,42,0.7), rgba(15,23,42,0.7)), url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1920&q=80') center/cover; color: #fff; padding: 80px 0; text-align: center; }
    .ta-h1 { font-family: 'Playfair Display', serif; font-size: 42px; margin-bottom: 15px; }
    .ta-hero-sub { font-size: 18px; margin-bottom: 30px; opacity: 0.9; }
    .ta-form-glass { background: rgba(255,255,255,0.95); padding: 30px; border-radius: 12px; color: var(--primary); max-width: 700px; margin: 0 auto; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); }
    .ta-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
    .ta-input, .ta-select { width: 100%; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; outline: none; }
    .ta-btn { background: var(--accent); color: #fff; border: none; padding: 14px 28px; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; font-size: 16px; transition: 0.3s; }
    .ta-btn:hover { background: #b45309; }
    .ta-section { padding: 60px 0; }
    .ta-h2 { font-family: 'Playfair Display', serif; font-size: 32px; text-align: center; margin-bottom: 40px; }
  </style>
</head>
<body>

<script>
  const TA_CONFIG = {
    agencyName: 'AURA TRAVEL',
    phone: '77774271681', // Ваш рабочий номер WhatsApp
    city: 'Алматы'
  };
</script>

<header class="ta-header">
  <div class="ta-container ta-header-inner">
    <a href="#" class="ta-logo-name">AURA TRAVEL</a>
    <span>Туры из Алматы</span>
  </div>
</header>

<section class="ta-hero">
  <div class="ta-container">
    <h1 class="ta-h1">Готовы отправиться в путешествие?</h1>
    <p class="ta-hero-sub">Оставьте заявку, и мы подберем горящие варианты под ваши даты</p>
    
    <form class="ta-form-glass" id="whatsapp-form">
      <h3 style="margin-bottom: 20px;">Быстрый подбор тура</h3>
      <div class="ta-form-grid">
        <input type="text" id="name" class="ta-input" placeholder="Ваше имя" required>
        <select id="destination" class="ta-select" required>
          <option value="" disabled selected>Куда хотите поехать?</option>
          <option value="Турция">Турция</option>
          <option value="Египет">Египет</option>
          <option value="ОАЭ">ОАЭ</option>
          <option value="Таиланд">Таиланд</option>
          <option value="Вьетнам">Вьетнам</option>
          <option value="Мальдивы">Мальдивы</option>
        </select>
        <input type="text" id="date" class="ta-input" placeholder="Когда вылет?">
        <input type="number" id="people" class="ta-input" placeholder="Сколько человек?" value="2" min="1">
      </div>
      <input type="tel" id="phone" class="ta-input" placeholder="Ваш номер WhatsApp (+7...)" style="margin-bottom: 15px;" required>
      <button type="submit" class="ta-btn">Получить варианты в WhatsApp</button>
    </form>
  </div>
</section>

<script>
  document.getElementById('whatsapp-form').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const name = document.getElementById('name').value;
    const dest = document.getElementById('destination').value;
    const date = document.getElementById('date').value || 'Ближайшие дни';
    const people = document.getElementById('people').value;
    const phone = document.getElementById('phone').value;
    
    const cleanPhone = TA_CONFIG.phone.replace(/[^0-9]/g, '');
    
    const text = `Здравствуйте! Меня зовут ${name}.\n` +
                 `Хочу подобрать тур: ${dest}\n` +
                 `Даты: ${date}\n` +
                 `Количество человек: ${people}\n` +
                 `Мой контактный телефон: ${phone}`;
                 
    const waUrl = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(text)}`;
    window.location.href = waUrl;
  });
</script>

</body>
</html>
